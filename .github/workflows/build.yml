name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Core is platform-neutral on purpose, so its tests run on the cheaper,
  # faster Linux runner. This job gates every push.
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Install the .NET 8 SDK explicitly so the net8.0 targeting pack is
          # present on the runner (avoids NETSDK1045 when the runner's default
          # SDK is newer). global.json rolls forward, so a newer SDK is fine too.
          dotnet-version: '8.0.x'

      # Restoring/building the Tests project pulls in Core via its project
      # reference, so both platform-neutral projects are covered without naming
      # two projects on one command (which MSBuild rejects: MSB1008) and without
      # touching the Windows-only App on this Linux runner.
      - name: Restore
        run: dotnet restore QuizBuilder.Tests/QuizBuilder.Tests.csproj

      - name: Build
        run: dotnet build QuizBuilder.Tests/QuizBuilder.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test QuizBuilder.Tests/QuizBuilder.Tests.csproj --configuration Release --no-build --verbosity normal

  # The WPF host needs a Windows runner. Kept as a separate job so a failure
  # here is obviously a UI-layer problem rather than a domain-logic one.
  # Enable once QuizBuilder.App exists.
  app-build:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Install the .NET 8 SDK explicitly so the net8.0 targeting pack is
          # present on the runner (avoids NETSDK1045 when the runner's default
          # SDK is newer). global.json rolls forward, so a newer SDK is fine too.
          dotnet-version: '8.0.x'

      - name: Publish portable single-file exe
        run: >
          dotnet publish QuizBuilder.App/QuizBuilder.App.csproj
          --configuration Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true

  # The MAUI Android player. Gated like the desktop app so a mobile compile
  # break is caught on push instead of only when the maintainer builds locally.
  # Runs on Windows because the Android MAUI workload does not install cleanly
  # on the Linux runner. This is a Debug build on purpose: the goal is "does it
  # still compile", not producing a signed, distributable artifact -- so no
  # keystore secret is needed and the job stays self-contained.
  android-build:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v5

      # Take the SDK from global.json rather than hardcoding a version here, so
      # this job always matches the .NET 10 pin the player requires (MAUI 10
      # rides .NET 10) without a second place to keep in sync.
      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # JDK 21: the Android SDK tooling used by net10.0-android rejects newer
      # JDKs (the XA0030 error we hit locally on JDK 25). Pinning 21 here keeps
      # CI on the exact JDK the local build script also selects.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      # Installs both the android and maui workloads. --ignore-failed-sources
      # keeps a transient NuGet source hiccup from failing the whole install.
      - name: Install MAUI Android workload
        run: dotnet workload install android maui --ignore-failed-sources

      - name: Restore
        run: dotnet restore QuizBuilder.Player/QuizBuilder.Player.csproj

      # Debug build, no signing. Compiling the player also compiles Core through
      # its project reference, so a break in either surfaces here.
      - name: Build Android (Debug)
        run: >
          dotnet build QuizBuilder.Player/QuizBuilder.Player.csproj
          --configuration Debug
          -f net10.0-android
          --no-restore
